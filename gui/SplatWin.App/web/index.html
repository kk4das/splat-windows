<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPLAT! map</title>
<link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font: 13px/1.4 "Segoe UI Variable", "Segoe UI", sans-serif; background: #f3f3f3; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: #555; font-size: 15px; pointer-events: none; z-index: 500; }
  [hidden] { display: none !important; }   /* #empty uses display:flex, which would beat the hidden attribute */
  #readout { position: absolute; left: 10px; bottom: 64px; z-index: 600; background: rgba(255,255,255,.9);
             padding: 3px 8px; border-radius: 4px; font: 12px Consolas, monospace; color: #222; }
  .station-label { font-weight: 600; }
  .editing .leaflet-container, .editing #map { cursor: crosshair; }
  @media (prefers-color-scheme: dark) { body { background: #202020; } #empty { color: #bbb; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="empty">Add a station to begin (Add station…), or open a SPLAT! coverage map (.kml).</div>
<div id="readout" hidden></div>
<script src="vendor/leaflet-1.9.4/leaflet.js"></script>
<script>
"use strict";
// Background maps (owner decision G2): streets and terrain, no satellite. Both need attribution.
const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });
const terrain = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
  maxZoom: 17, subdomains: "abc",
  attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)' });

const map = L.map("map", { zoomSnap: 0.25, layers: [streets] }).setView([39.0, -77.2], 9);
L.control.layers({ "Streets": streets, "Terrain": terrain }, null, { position: "topright" }).addTo(map);
L.control.scale({ imperial: true, metric: true }).addTo(map);

let overlay = null, sites = L.layerGroup().addTo(map), opacity = 0.65;
const readout = document.getElementById("readout");
map.on("mousemove", e => {
  readout.hidden = false;
  readout.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
});

// fitBounds needs the map's real size. If the view has no size yet (window still laying out),
// fit as soon as it gets one; otherwise Leaflet zooms out to the whole world.
function fitWhenSized(bounds) {
  map.invalidateSize();
  const s = map.getSize();
  if (s.x > 0 && s.y > 0) { map.fitBounds(bounds); return; }
  const ro = new ResizeObserver(() => {
    map.invalidateSize();
    const t = map.getSize();
    if (t.x > 0 && t.y > 0) { ro.disconnect(); map.fitBounds(bounds); }
  });
  ro.observe(document.getElementById("map"));
}

function post(msg) { if (window.chrome && chrome.webview) chrome.webview.postMessage(msg); }

// Called by the app (or by ?overlay=<json url> for testing in a plain browser).
// The image is already re-sampled to Web Mercator rows, so a plain stretch between the corners is exact.
window.splat = {
  showMap(m) {
    document.getElementById("empty").hidden = true;
    if (overlay) map.removeLayer(overlay);
    sites.clearLayers();
    const bounds = [[m.south, m.west], [m.north, m.east]];
    overlay = L.imageOverlay(m.image, bounds, { opacity, interactive: false }).addTo(map);
    overlay.on("load", () => post({ type: "overlay-loaded" }));
    overlay.on("error", () => post({ type: "error", text: "map image failed to load" }));
    // A placemark on one of the user's stations (same name, within ~100 m) is already labelled by the station dot.
    const near = p => stationList.some(s => s.name.toUpperCase() === (p.name || "").toUpperCase() && map.distance([s.lat, s.lon], [p.lat, p.lon]) < 100);
    for (const p of (m.placemarks || []).filter(p => !near(p)))
      L.marker([p.lat, p.lon], { title: p.name }).bindTooltip(p.name, { permanent: true, direction: "right" }).addTo(sites);
    fitWhenSized(bounds);
  },
  setOpacity(v) { opacity = v; if (overlay) overlay.setOpacity(v); },

  // ---- stations (G1) ----
  // Saved stations: blue dots with their names. Clicking one selects it in the app's list.
  setStations(list) {
    stationList = list || [];
    if (stationList.length > 0) document.getElementById("empty").hidden = true;   // the hint is only for an empty map
    stations.clearLayers();
    for (const s of list || [])
      L.circleMarker([s.lat, s.lon], { radius: 6, color: "#0b4f99", weight: 2, fillColor: "#2b88d8", fillOpacity: 0.95 })
        .bindTooltip(s.name, { permanent: true, direction: "right", className: "station-label" })
        .on("click", e => { L.DomEvent.stopPropagation(e); post({ type: "station-click", name: s.name }); })
        .addTo(stations);
  },
  focusStation(lat, lon) { map.setView([lat, lon], Math.max(map.getZoom(), 13)); },

  // The pin being placed while adding or editing a station. It can be dragged, and while
  // editing a click on the map moves it there. Either way the app is told the new position.
  setPin(lat, lon, rect, zoom) {
    document.getElementById("empty").hidden = true;
    if (!pin) {
      pin = L.marker([lat, lon], { draggable: true, autoPan: true, zIndexOffset: 1000, title: "Drag me onto the antenna" }).addTo(map);
      pin.on("dragend", () => { const p = pin.getLatLng(); post({ type: "pin", lat: p.lat, lon: p.lng }); });
    } else pin.setLatLng([lat, lon]);
    if (square) { map.removeLayer(square); square = null; }
    if (rect) square = L.rectangle(rect, { color: "#d83b01", weight: 2, fill: true, fillOpacity: 0.06, dashArray: "6 4", interactive: false }).addTo(map);
    if (zoom) {
      if (square) fitWhenSized(square.getBounds());
      else { map.invalidateSize(); map.setView([lat, lon], 15); }
    }
  },
  clearPin() {
    if (pin) { map.removeLayer(pin); pin = null; }
    if (square) { map.removeLayer(square); square = null; }
  },
  setEditing(on) { editing = !!on; document.body.classList.toggle("editing", editing); },

  // ---- path analysis (G3) ----
  // The path as a line between the two stations: green when SPLAT! found line of sight, red
  // dashed when terrain blocks it, with SPLAT!'s obstructions as red rings.
  showPath(p) {
    path.clearLayers();
    const a = [p.tx.lat, p.tx.lon], b = [p.rx.lat, p.rx.lon];
    L.polyline([a, b], p.clear ? { color: "#107c10", weight: 4, opacity: 0.9 }
                               : { color: "#d13438", weight: 4, opacity: 0.9, dashArray: "10 6" })
      .bindTooltip(`${p.tx.name} to ${p.rx.name}: ${p.clear ? "line of sight" : "blocked by terrain"}`, { sticky: true })
      .addTo(path);
    for (const o of p.obstructions || [])
      L.circleMarker([o.lat, o.lon], { radius: 6, color: "#a4262c", weight: 2, fillColor: "#ffffff", fillOpacity: 0.9 })
        .bindTooltip(o.label).addTo(path);
    document.getElementById("empty").hidden = true;
    fitWhenSized(L.latLngBounds([a, b]).pad(0.15));
    post({ type: "path-shown", obstructions: (p.obstructions || []).length });
  },
  clearPath() { path.clearLayers(); },

  // ---- readout (G5): the app's answer for a clicked point ----
  showProbe(lat, lon, text) {
    const div = document.createElement("div");
    div.textContent = text;            // plain text, never HTML
    div.style.maxWidth = "240px";
    L.popup({ autoPan: false }).setLatLng([lat, lon]).setContent(div).openOn(map);
  },
};

let path = L.layerGroup().addTo(map), stationList = [];
let stations = L.layerGroup().addTo(map), pin = null, square = null, editing = false;
map.on("click", e => {
  if (!editing) {   // on a coverage map, ask the app what the map shows here (G5 readout)
    if (overlay) post({ type: "probe", lat: e.latlng.lat, lon: e.latlng.lng });
    return;
  }
  if (pin) pin.setLatLng(e.latlng);   // keeps a grid square's outline while refining inside it
  else window.splat.setPin(e.latlng.lat, e.latlng.lng, null, false);
  post({ type: "pin", lat: e.latlng.lat, lon: e.latlng.lng });
});

const q = new URLSearchParams(location.search).get("overlay");
if (q) {
  const base = new URL(q, location.href);   // the image path in the JSON is relative to the JSON file
  fetch(base).then(r => r.json()).then(m => { m.image = new URL(m.image, base).href; window.splat.showMap(m); });
}
post({ type: "ready" });
</script>
</body>
</html>
